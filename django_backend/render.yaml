services:
  - type: web
    name: planmystay-django-api
    env: python
    region: singapore
    plan: starter
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: gunicorn --config gunicorn.conf.py planmystay.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: planmystay-postgres
          property: connectionString
      - key: ALLOWED_HOSTS
        value: planmystay-django-api.onrender.com,api.planmystay.in
      - key: CORS_ALLOWED_ORIGINS
        value: https://planmystay.in,https://planmystay.vercel.app

databases:
  - name: planmystay-postgres
    plan: starter
    region: singapore
    databaseName: planmystay_prod
    user: planmystay_admin
